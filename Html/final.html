<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>¡Gracias por tu compra!</title>
  <style>
    /* Fuente moderna */
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap');

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #0d1117, #1b2735);
      font-family: 'Orbitron', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    .mensaje {
      background: rgba(15, 22, 30, 0.95);
      padding: 60px 80px;
      border-radius: 20px;
      box-shadow: 0 0 25px #00bfff77;
      text-align: center;
      transform: scale(0.8);
      animation: aparecer 1s ease-out forwards;
      border: 2px solid #00bfff;
    }

    .mensaje h1 {
      font-size: 48px;
      background: linear-gradient(90deg, #00bfff, #007BFF);
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 10px #007BFF66;
      margin-bottom: 20px;
    }

    .mensaje p {
      font-size: 20px;
      color: #d1e4f2;
      margin-top: 10px;
    }

    @keyframes aparecer {
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* Luces flotantes tipo neón */
    .burbuja {
      position: absolute;
      bottom: -100px;
      background: rgba(0, 191, 255, 0.2);
      border: 1px solid #00bfff66;
      box-shadow: 0 0 10px #00bfff66;
      border-radius: 50%;
      animation: flotando 12s linear infinite;
      opacity: 0.6;
    }

    @keyframes flotando {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0.6;
      }
      100% {
        transform: translateY(-1200px) scale(1.3);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="mensaje">
    <h1>¡Gracias por tu compra!</h1>
    <p>Tu pedido ha sido procesado exitosamente.</p>
  </div>

  <!-- Efectos de luces flotantes -->
  <div class="burbuja" style="left: 10%; width: 20px; height: 20px;"></div>
  <div class="burbuja" style="left: 25%; width: 30px; height: 30px;"></div>
  <div class="burbuja" style="left: 50%; width: 15px; height: 15px;"></div>
  <div class="burbuja" style="left: 70%; width: 25px; height: 25px;"></div>
  <div class="burbuja" style="left: 85%; width: 18px; height: 18px;"></div>


  <script>
    localStorage.removeItem('carrito');
    </script>
    
</body>
</html>
